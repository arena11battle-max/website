# Runs ARENA11: PostgreSQL + the app (API, live updates and web UI on port 8080).
#   1. Copy .env.example to .env and fill in the two secrets.
#   2. docker compose up -d --build
#   3. Open http://<this-computer's-IP>:8080 on any phone, tablet or laptop on the same Wi-Fi.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arena -d arena']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arena:${DB_PASSWORD}@db:5432/arena
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_PLAYERS: ${MAX_PLAYERS:-8}
      RESPAWN_SECONDS: ${RESPAWN_SECONDS:-8}
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
    ports:
      - '8080:8080'

volumes:
  dbdata:
